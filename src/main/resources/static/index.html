<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结算对账实验室</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#152638;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:24px}header{background:#142d45;color:white;padding:30px;border-radius:18px}h1{margin:4px 0;font-size:32px}h2{font-size:19px}section{background:white;padding:24px;border:1px solid #d7dfe8;border-radius:14px;margin-top:20px}button{background:#007f79;border:0;border-radius:7px;color:white;padding:10px 16px;margin:6px 8px 6px 0;cursor:pointer}input,select,textarea{font:inherit;padding:9px;border:1px solid #b7c5d3;border-radius:6px;max-width:100%}textarea{width:100%;min-height:120px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;padding:16px;border-radius:8px;max-height:560px;overflow:auto}label{display:inline-block;margin:8px 12px 8px 0}a{color:#007f79}#notice{font-weight:600;color:#884913;min-height:26px}.tag{color:#7fe0cf}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}</style><main><header><span class="tag">PORTFOLIO / 01 · JAVA 21</span><h1>结算对账实验室</h1><p>USD · 规则快照 · 幂等确认 · 批次与明细状态</p></header><section><h2>01 / 生成样例与导入账单</h2><p>阶梯规则：本金 ≥ 5000 时 8%，其余 10%。每笔按 HALF_UP 保留两位。</p><button id="seed">生成三笔订单</button><label>账单编号 <input id="ref" value="DEMO-001"></label><textarea id="csv">order_id,amount
ORDER-001,100.00
ORDER-002,480.00
EXTERNAL-ONLY,10.00</textarea><button id="import">导入 / 重复导入</button></section><section><h2>02 / 核对与结算</h2><p>确认仅纳入 MATCHED 明细；差异行保留待人工核对，不进入付款。</p><label>导入 ID <input id="importId" size="42"></label><button id="confirm">确认匹配项 / 重复确认</button><label>批次 ID <input id="batchId" size="42"></label><button id="pay">模拟部分成功</button><button id="state">刷新总览</button></section><section><div id="notice" role="status"></div><pre id="output">点击“生成三笔订单”开始。</pre></section></main><script>const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||JSON.stringify(j));return j}function show(x){$('output').textContent=JSON.stringify(x,null,2)}async function run(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=e.message}}
$('seed').onclick=()=>run(async()=>show(await api('/seed',{})));
$('import').onclick=()=>run(async()=>{const x=await api('/imports',{billRef:$('ref').value,csv:$('csv').value});$('importId').value=x.import.ID;show(x)});
$('confirm').onclick=()=>run(async()=>{const x=await api('/imports/'+$('importId').value+'/confirm',{});$('batchId').value=x.batch.ID;show(x)});
$('pay').onclick=()=>run(async()=>show(await api('/batches/'+$('batchId').value+'/results',{eventId:'demo-'+$('batchId').value,results:[{orderId:'ORDER-001',status:'SUCCESS',reason:null},{orderId:'ORDER-002',status:'FAILED',reason:'synthetic bank rejection'}]})));
$('state').onclick=()=>run(async()=>show(await api('/state')));
</script></html>
